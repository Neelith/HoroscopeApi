info:
  name: GetDateHoroscope
  type: http
  seq: 1
  tags:
    - Horoscopes

http:
  method: GET
  url: "{{baseUrl}}/horoscopes/:signName/date/:date"
  params:
    - name: signName
      value: aries
      type: path
    - name: date
      value: 2027-01-30
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

