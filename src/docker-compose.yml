services:
  postgres:
    image: postgres:17
    container_name: horoscope_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - horoscope_postgres_data:/var/lib/postgresql/data
    networks:
      - horoscope-internal
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: horoscope_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - horoscope_redis_data:/data
    networks:
      - horoscope-internal
    restart: unless-stopped

  api:
    image: ghcr.io/neelith/horoscopeapi:1.2.0
    container_name: horoscope_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__HoroscopeApiDb=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=true
      - RedisSettings__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - RedisSettings__KeyPrefix=prod
      - JwtSettings__Authority=https://identity.alessandroaverna.com/realms/whiletrue
      - JwtSettings__Issuer=https://identity.alessandroaverna.com/realms/whiletrue
      - JwtSettings__Audience=account
      - ApiKeySettings__Secret=${API_KEY_SECRET}
    ports:
      - "9080:8080"
    networks:
      - horoscope-internal
      - dokploy-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

networks:
  horoscope-internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  horoscope_postgres_data:
    name: horoscope_postgres_data
  horoscope_redis_data:
    name: horoscope_redis_data